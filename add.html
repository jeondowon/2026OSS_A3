<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="무비로그 - 영화 기록 추가" />
    <meta name="author" content="jeondowon" />
    <title>무비로그 · 기록 추가</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="my.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-md bg-body-tertiary border-bottom">
      <div class="container page-container">
        <a class="navbar-brand" href="index.html">🎬 무비로그</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navMenu"
          aria-controls="navMenu"
          aria-expanded="false"
          aria-label="메뉴 열기"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">목록</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="add.html">기록 추가</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="example.html">Bootstrap 예제</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <header class="page-header py-4 py-md-5">
      <div class="container page-container">
        <h1 class="page-title fw-bold mb-1">새 영화 기록 추가</h1>
        <p class="text-secondary mb-0">감상한 영화 정보를 입력해주세요.</p>
      </div>
    </header>

    <main class="container page-container py-4">
      <!--
        Validation (JavaScript, validateAddForm() 함수에서 검사):
        1. 필수값 입력 여부  - title, director, genre, rating
        2. 문자열 길이       - title (2자 이상 80자 이하)
        3. 숫자 범위         - rating (1~5)
        4. Select 선택 여부  - genre
        검증을 모두 통과해야 alert('게시물이 추가됩니다.')가 뜨고 index.html로 이동합니다.
      -->
      <form class="form-card" action="index.html" method="get" onsubmit="return validateAddForm();">
        <div class="mb-3">
          <label for="title" class="form-label">제목<span class="required-mark">*</span></label>
          <input
            type="text"
            class="form-control"
            id="title"
            name="title"
            minlength="2"
            maxlength="80"
            required
          />
        </div>

        <div class="mb-3">
          <label for="genre" class="form-label">장르<span class="required-mark">*</span></label>
          <select class="form-select" id="genre" name="genre" required>
            <option value="" selected disabled>장르를 선택하세요</option>
            <option value="액션">액션</option>
            <option value="드라마">드라마</option>
            <option value="코미디">코미디</option>
            <option value="SF">SF</option>
            <option value="공포">공포</option>
            <option value="로맨스">로맨스</option>
            <option value="애니메이션">애니메이션</option>
            <option value="다큐멘터리">다큐멘터리</option>
            <option value="스릴러">스릴러</option>
            <option value="판타지">판타지</option>
          </select>
        </div>

        <div class="mb-3">
          <label for="director" class="form-label">감독<span class="required-mark">*</span></label>
          <input type="text" class="form-control" id="director" name="director" required />
        </div>

        <div class="mb-3">
          <label for="rating" class="form-label">평점 (1~5)<span class="required-mark">*</span></label>
          <input
            type="number"
            class="form-control"
            id="rating"
            name="rating"
            min="1"
            max="5"
            step="1"
            required
          />
        </div>

        <div class="mb-3">
          <label for="review" class="form-label">리뷰 / 메모</label>
          <textarea
            class="form-control"
            id="review"
            name="review"
            rows="4"
            maxlength="500"
            placeholder="영화에 대한 감상평을 자유롭게 남겨보세요 (500자 이내)"
          ></textarea>
        </div>

        <div class="mb-4">
          <label for="poster" class="form-label">포스터 이미지 URL</label>
          <input
            type="url"
            class="form-control"
            id="poster"
            name="poster"
            placeholder="https://example.com/poster.jpg"
          />
          <div class="form-text">비워두면 기본 이미지가 표시됩니다.</div>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary btn-lg">추가</button>
          <a href="index.html" class="btn btn-outline-secondary btn-lg">목록으로</a>
        </div>
      </form>
    </main>

    <footer class="site-footer text-center">
      <div class="container page-container">
        &copy; 2026 무비로그 · OSS Assignment 03
      </div>
    </footer>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script>
      function validateAddForm() {
        const title = document.getElementById("title").value.trim();
        const genre = document.getElementById("genre").value;
        const director = document.getElementById("director").value.trim();
        const rating = document.getElementById("rating").value;

        if (!title || !genre || !director || !rating) {
          alert("필수 항목(제목, 장르, 감독, 평점)을 모두 입력해주세요.");
          return false;
        }
        if (title.length < 2 || title.length > 80) {
          alert("제목은 2자 이상 80자 이하로 입력해주세요.");
          return false;
        }
        if (Number(rating) < 1 || Number(rating) > 5) {
          alert("평점은 1점에서 5점 사이로 입력해주세요.");
          return false;
        }

        alert("게시물이 추가됩니다.");
        return true;
      }
    </script>
  </body>
</html>
